name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / tests and static JS
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run test suite
        run: python -m pytest tests/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse browser JavaScript
        shell: bash
        run: |
          for script in static/js/*.js; do
            node --check "$script"
          done

  sharing-windows:
    name: Native sharing round trip / Windows Python 3.10
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install locked application and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Create a source-only checkout in a Chinese and space path
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import uuid

          root = Path.cwd()
          target = Path(os.environ["RUNNER_TEMP"]) / ("MathBank 中文 空格 分享-" + uuid.uuid4().hex)
          target.mkdir()
          tracked = subprocess.check_output(["git", "ls-files", "-z"], cwd=root).decode("utf-8").split("\0")
          for name in filter(None, tracked):
              relative = Path(name)
              source = root / relative
              if not source.is_file():
                  continue
              if any(part in {".git", ".system_generated", "uploads", "data_backup", "venv", "static_副本"} for part in relative.parts):
                  continue
              if source.name.startswith(".env") and name != ".env.example":
                  continue
              destination = target / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("MATHBANK_SHARING_QA_ROOT=" + str(target) + "\n")
      - name: Exercise native backup, sharing, rollback and task receipts
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:MATHBANK_SHARING_QA_ROOT
          python -B -m pytest tests/test_gitignore_privacy.py tests/test_storage_access.py tests/test_windows_launcher.py tests/test_library_transfer_storage_api.py tests/test_library_transfer_windows.py tests/test_library_transfer.py tests/test_library_transfer_api.py tests/test_library_transfer_tasks.py tests/test_library_transfer_tasks_api.py tests/test_library_transfer_upload.py tests/test_library_transfer_record_memory.py tests/test_library_transfer_batch_import.py tests/test_library_transfer_batch_export.py tests/test_raster_validation.py tests/test_question_fingerprint_batches.py tests/test_question_duplicates.py tests/test_sync_exchange_catalog_memory.py tests/test_sync_batch_export.py tests/test_question_reference_batches.py tests/test_asset_security.py tests/test_full_backup.py -q --junitxml=sharing-windows.xml
      - name: Preserve native regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharing-windows-results
          path: ${{ env.MATHBANK_SHARING_QA_ROOT }}/sharing-windows.xml
          if-no-files-found: ignore

  pandoc-native:
    name: Native Pandoc installation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install isolated test runner
        run: python -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Verify real download, Unicode paths, OMML and cached reinstallation
        env:
          MATHBANK_TEST_PANDOC_NATIVE: "1"
        run: python -m pytest --noconftest tests/test_runtime_components.py

  release-guards:
    name: Release guards / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install guard-test runner
        run: python -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Run Release and launcher guard tests without app conftest
        run: python -m pytest --noconftest tests/test_release_hardening.py tests/test_windows_launcher.py
      - name: Build, package, and import-smoke the embedded Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from scripts import build_release as b; b.clean_directories(); b.download_python(); b.download_and_extract_sqlite(); b.download_and_extract_msvc_runtime(); b.configure_python_path(); b.download_and_extract_wheels(); b.copy_app_files(b.BUILD_DIR, b.WINDOWS_LAUNCHER_NAME); b.create_launcher(); b.validate_windows_runtime(b.BUILD_DIR); b.zip_release()"
      - name: Start and reopen the packaged Windows service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $PWD 'dist\MathBank-Windows-x64.zip'
          $testRoot = Join-Path $env:RUNNER_TEMP (
            'MathBank 中文 空格 启动-' + [Guid]::NewGuid().ToString('N')
          )
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $testRoot
          $launcher = Join-Path $testRoot '启动题库系统.bat'
          $statePath = Join-Path $testRoot '.system_generated\server-state.json'
          $env:MATHBANK_NO_PAUSE = '1'
          $env:MATHBANK_NO_BROWSER = '1'
          $stateDirectory = Join-Path $testRoot '.system_generated'
          New-Item -ItemType Directory -Path $stateDirectory | Out-Null
          Set-Content -LiteralPath $statePath -Value 'invalid old state'
          Set-Content -LiteralPath (Join-Path $stateDirectory 'installed-release-manifest.json') `
            -Value 'invalid historical manifest'
          $sleeper = Start-Process -FilePath "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -ArgumentList @('-NoProfile', '-Command', 'Start-Sleep -Seconds 300') -PassThru
          Set-Content -LiteralPath (Join-Path $stateDirectory 'server.pid') -Value $sleeper.Id

          function Invoke-PackagedLauncher {
            # Pass cmd's command line verbatim, without PowerShell re-quoting it.
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = $env:ComSpec
            $start.Arguments = '/d /s /c ""{0}""' -f $launcher
            $start.UseShellExecute = $false
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.StandardOutputEncoding = [Text.Encoding]::UTF8
            $start.StandardErrorEncoding = [Text.Encoding]::UTF8
            $process = [Diagnostics.Process]::Start($start)
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            $process.WaitForExit()
            $output = $stdout.GetAwaiter().GetResult() + $stderr.GetAwaiter().GetResult()
            $exitCode = $process.ExitCode
            $process.Dispose()
            Write-Host $output
            if ($exitCode -ne 0) {
              throw "Packaged launcher failed with exit code $exitCode."
            }
            if ($output.Contains("��")) {
              throw 'Packaged launcher output contains Unicode replacement characters.'
            }
            if ($output -match '(?i)is not recognized as an internal or external command') {
              throw 'cmd.exe parsed part of the packaged launcher output as a command.'
            }
          }

          try {
            Invoke-PackagedLauncher
            $first = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
            if ($null -eq (Get-Process -Id ([int]$first.pid) -ErrorAction SilentlyContinue)) {
              throw 'The first packaged service process is not running.'
            }

            Invoke-PackagedLauncher
            $second = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
            if ([string]$second.launch_id -ne [string]$first.launch_id) {
              throw 'A repeated double click replaced the existing service.'
            }
            $sleeper.Refresh()
            if ($sleeper.HasExited) {
              throw 'The launcher stopped an unrelated process from an old PID file.'
            }

            $request = [Net.HttpWebRequest]::Create('http://127.0.0.1:8000/healthz')
            $request.Proxy = $null
            $request.KeepAlive = $false
            $request.Timeout = 2000
            $response = $request.GetResponse()
            $reader = New-Object IO.StreamReader($response.GetResponseStream())
            $health = ($reader.ReadToEnd() | ConvertFrom-Json)
            $response.Close()
            if ([string]$health.server_instance_id -ne [string]$second.launch_id) {
              throw 'Health response is not bound to the restarted launch ID.'
            }
          }
          finally {
            $sleeper.Refresh()
            if (-not $sleeper.HasExited) {
              $sleeper.Kill()
              $sleeper.WaitForExit()
            }
            if (Test-Path -LiteralPath $statePath -PathType Leaf) {
              try {
                $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
                $token = (Get-Content -LiteralPath (
                  Join-Path $testRoot '.system_generated\local_token'
                ) -Raw).Trim()
                $request = [Net.HttpWebRequest]::Create(
                  'http://127.0.0.1:8000/api/shutdown'
                )
                $request.Proxy = $null
                $request.KeepAlive = $false
                $request.Timeout = 2000
                $request.Method = 'POST'
                $request.Headers.Add('X-Local-Token', $token)
                $request.Headers.Add('X-MathBank-Launch-ID', [string]$state.launch_id)
                $request.ContentLength = 0
                $shutdownResponse = $request.GetResponse()
                $shutdownResponse.Close()
                for ($attempt = 0; $attempt -lt 20; $attempt++) {
                  Start-Sleep -Milliseconds 250
                  if ($null -eq (Get-Process -Id ([int]$state.pid) -ErrorAction SilentlyContinue)) {
                    break
                  }
                }
                if ($null -ne (Get-Process -Id ([int]$state.pid) -ErrorAction SilentlyContinue)) {
                  throw 'The restarted service did not exit cooperatively during cleanup.'
                }
              }
              catch {
                Write-Error "Cooperative CI cleanup failed: $($_.Exception.Message)"
              }
            }
            Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Parse macOS launcher
        if: runner.os == 'macOS'
        shell: bash
        run: bash -n '启动题库系统.command'


  pillow-windows311:
    name: Pillow 13 application / Windows Python 3.11
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          check-latest: true
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked application and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify actual Windows runtime and native imports
        shell: python {0}
        run: |
          from pathlib import Path
          import sys
          import sqlite3
          import PIL
          import pymupdf
          import pdf_inspector

          assert sys.platform == "win32", sys.platform
          assert sys.version_info[:2] == (3, 11), sys.version
          assert PIL.__version__ == "13.0.0", PIL.__version__
          runtime = (sys.version + "\nPillow " + PIL.__version__
                     + "\nSQLite " + sqlite3.sqlite_version + "\n")
          print(runtime, end="")
          Path("runtime-windows311.txt").write_text(runtime, encoding="utf-8")
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Exercise native Windows locks and image decoding
        shell: pwsh
        run: |
          python -m pytest -q tests/test_document_project_windows_locks.py tests/test_asset_lifecycle.py tests/test_asset_security.py tests/test_raster_validation.py tests/test_processing_limits.py --durations=15 --junitxml=focused-windows311.xml | Tee-Object -FilePath focused-windows311.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run complete application regression suite
        shell: pwsh
        run: |
          python -m pytest -q tests/ --durations=25 --junitxml=full-windows311.xml | Tee-Object -FilePath full-windows311.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pillow-windows311-results
          path: |
            runtime-windows311.txt
            focused-windows311.xml
            focused-windows311.log
            full-windows311.xml
            full-windows311.log
          if-no-files-found: warn
